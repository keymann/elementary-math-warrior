<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>페이지를 찾을 수 없어요</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        display: grid;
        place-items: center;
        background: #1b2416;
        color: #e8f0e2;
        font-family: Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', system-ui, sans-serif;
        text-align: center;
        padding: 24px;
      }
      .emoji { font-size: 56px; }
      h1 { font-size: 20px; margin: 12px 0 6px; }
      p { margin: 0 0 20px; color: #a9b8a0; font-size: 14px; }
      a {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        padding: 0 20px;
        border-radius: 10px;
        background: #37b24d;
        color: #fff;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div>
      <div class="emoji">🧭</div>
      <h1>페이지를 찾을 수 없어요</h1>
      <p>주소를 다시 확인해 주세요.</p>
      <a href="/">처음으로</a>
    </div>
  </body>
</html>
